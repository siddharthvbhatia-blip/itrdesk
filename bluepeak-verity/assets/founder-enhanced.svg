<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="CA Siddharth Bhatia">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f1f5fb"/>
      <stop offset="1" stop-color="#e7eff8"/>
    </radialGradient>
    <clipPath id="portraitClip"><circle cx="450" cy="450" r="420"/></clipPath>
    <filter id="photoEnhance" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="1.04" result="sat"/>
      <feComponentTransfer in="sat" result="contrast">
        <feFuncR type="linear" slope="1.07" intercept="-0.035"/>
        <feFuncG type="linear" slope="1.07" intercept="-0.035"/>
        <feFuncB type="linear" slope="1.07" intercept="-0.035"/>
      </feComponentTransfer>
      <feConvolveMatrix in="contrast" order="3" kernelMatrix="0 -0.10 0 -0.10 1.40 -0.10 0 -0.10 0" preserveAlpha="true"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#071a2b" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea2ff"/>
      <stop offset="0.55" stop-color="#286fe5"/>
      <stop offset="1" stop-color="#26b7a0"/>
    </linearGradient>
  </defs>
  <circle cx="450" cy="450" r="438" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="450" cy="450" r="428" fill="url(#ring)"/>
  <circle cx="450" cy="450" r="420" fill="url(#bg)"/>
  <g clip-path="url(#portraitClip)">
    <rect width="900" height="900" fill="url(#bg)"/>
    <image href="../../assets/ca-siddharth-bhatia-final-r16.jpg" x="0" y="0" width="900" height="900" preserveAspectRatio="xMidYMid slice" filter="url(#photoEnhance)"/>
  </g>
  <circle cx="450" cy="450" r="420" fill="none" stroke="#ffffff" stroke-width="18"/>
  <circle cx="450" cy="450" r="438" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.7"/>
</svg>