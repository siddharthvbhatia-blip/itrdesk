<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="CA Siddharth Bhatia">
  <defs>
    <clipPath id="photoClip">
      <circle cx="450" cy="450" r="176"/>
    </clipPath>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea2ff"/>
      <stop offset="0.52" stop-color="#286fe5"/>
      <stop offset="1" stop-color="#26b7a0"/>
    </linearGradient>
    <radialGradient id="backdrop" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#eef4fb" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071a2b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="450" cy="450" r="205" fill="#ffffff" filter="url(#softShadow)"/>
  <circle cx="450" cy="450" r="196" fill="url(#ring)"/>
  <circle cx="450" cy="450" r="184" fill="url(#backdrop)"/>

  <g clip-path="url(#photoClip)">
    <image href="/itrdesk/assets/ca-siddharth-bhatia-final-r16.jpg"
           x="274" y="274" width="352" height="352"
           preserveAspectRatio="xMidYMid slice"/>
  </g>

  <circle cx="450" cy="450" r="176" fill="none" stroke="#ffffff" stroke-width="12"/>
  <circle cx="450" cy="450" r="196" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.78"/>
</svg>